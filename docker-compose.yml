services:
  postgres-auth:
    image: postgres:16-alpine
    container_name: crediya-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: crediya_auth
      POSTGRES_USER: crediya
      POSTGRES_PASSWORD: crediya123
    ports:
      - "5432:5432"
    volumes:
      - crediya_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crediya -d crediya_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  crediya_auth_data: